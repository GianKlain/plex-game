<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Play Plex</title>
<meta name="description" content="Practise Plex against the computer or a friend on the same device.">
<meta name="theme-color" content="#e3e5eb">
<link rel="icon" href="../assets/img/plex-icon.png">
<link rel="apple-touch-icon" href="../assets/img/plex-icon-256x256.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="pieces.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main id="home" class="screen">
  <header class="home-top">
    <a href="../" aria-label="plex.swiss"><img class="home-logo" src="../assets/img/plex-logo.svg" alt="Plex"></a>
    <a class="rules-link" href="../rules.html">Rules <span class="i" aria-hidden="true">i</span></a>
  </header>

  <div class="modes">
    <div class="mode off">
      <button class="mode-main" disabled>
        <svg class="hexicon" viewBox="0 0 50 50" aria-hidden="true"><path d="M25 2 45 13.5v23L25 48 5 36.5v-23z" fill="#fff"/><path d="M17 21h14l-3.5-3.5M33 29H19l3.5 3.5" fill="none" stroke="#ff4b3e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="txt"><b>VS Random Player</b><small>15' min game / 12 stones · coming soon</small></span>
      </button>
    </div>
    <div class="mode">
      <button class="mode-main" id="start-local">
        <svg class="hexicon" viewBox="0 0 50 50" aria-hidden="true"><path d="M25 46C12 37 4 29 4 19A11 11 0 0 1 25 13 11 11 0 0 1 46 19C46 29 38 37 25 46z" fill="#fff"/><rect x="18" y="17" width="10" height="12" rx="2" fill="none" stroke="#5b7fd6" stroke-width="2.2"/><path d="M22 14h8a2 2 0 0 1 2 2v10" fill="none" stroke="#5b7fd6" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="txt"><b>VS Friend</b><small>Pass one device · invite link coming soon</small></span>
      </button>
    </div>
    <div class="mode">
      <button class="mode-main" id="start-ai">
        <svg class="hexicon" viewBox="0 0 50 50" aria-hidden="true"><path d="M12 46V36C7 32 5 27 6 21 8 10 16 4 26 4c11 0 18 8 18 18 0 3-1 5-1 7l3 6-4 2v6c0 2-2 3-4 3H12z" fill="#fff"/><g stroke="#ffc02e" stroke-width="2.4" stroke-linecap="round"><path d="M25 14v14M18 21h14M20 16l10 10M30 16 20 26"/></g></svg>
        <span class="txt"><b>VS Ai</b><small id="ai-sub">Level easy</small></span>
      </button>
      <div class="chips" id="levels" role="radiogroup" aria-label="Level">
        <button role="radio" data-level="easy" aria-checked="true">Easy</button>
        <button role="radio" data-level="medium" aria-checked="false">Medium</button>
        <button role="radio" data-level="hard" aria-checked="false">Hard</button>
      </div>
    </div>
  </div>

  <section class="sheet">
    <div class="sheet-head">
      <h2>Game Archive</h2>
      <span class="pill w" id="w-pct" hidden></span>
      <span class="pill l" id="l-pct" hidden></span>
    </div>
    <ul id="archive" class="archive"></ul>
    <p class="sub" id="archive-empty">Your games will appear here.</p>
    <button class="btn outline" id="copy-games" hidden>Copy game log</button>

    <div class="sheet-head" style="margin-top:10px"><h2>Patterns</h2></div>
    <p class="sub" id="patterns-sub">Every finished game leaves a pattern. Win one that has never been played and you may name it.</p>
    <ul id="patterns" class="patterns"></ul>
  </section>
</main>

<main id="game" class="screen" hidden>
  <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Plex board"></svg>
  <button class="round" id="menu-btn" aria-label="Options">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19 12H6m5-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="pbar" id="bar-top"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <p id="hint"></p>
  <button class="round" id="rotate-btn" aria-label="Rotate stone">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.2-5.1M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="round" id="place-btn" aria-label="End turn">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12h13m-5-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="pbar" id="bar-bottom"></div>
</main>

<dialog id="menu">
  <h2>OPTIONS</h2>
  <button class="link" data-act="grid">Hide background grid</button>
  <button class="link" data-act="rematch">Resign and rematch</button>
  <button class="link" data-act="home">Abandon</button>
  <button class="btn" data-act="close">Back to game</button>
</dialog>

<dialog id="over">
  <div class="star">
    <h2 id="over-title"></h2>
    <p id="over-sub"></p>
    <p id="over-score"></p>
  </div>
  <p id="over-note"></p>
  <div id="over-pattern" hidden>
    <p id="pattern-line"></p>
    <form id="claim" hidden>
      <input id="claim-name" maxlength="40" placeholder="Name this pattern" aria-label="Pattern name" autocomplete="off" required>
      <button class="btn" type="submit">Claim</button>
    </form>
  </div>
  <button class="btn" data-act="rematch">Rematch</button>
  <button class="btn outline" data-act="home">Back to home</button>
  <div class="minor">
    <button class="link" data-act="view">Look at the board</button>
    <button class="link" data-act="copy">Copy game</button>
  </div>
</dialog>

<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
